<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My tasks — LivEZ</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#161a2b;--mu:#6b7186;--ln:#e4e7f0;--ac:#4f46e5;--ok:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#181c30;--tx:#eceefa;--mu:#9aa0b8;--ln:#2a2f4a;--ac:#818cf8;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Manrope,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0 0 2px}h1 b{color:var(--ac)}
.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:10px;font:inherit;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.sm{padding:3px 9px;font-size:13px}
input[type=text],select{width:100%;padding:9px 10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.bar{height:10px;background:var(--ln);border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok);transition:width .2s}
.chk{display:flex;gap:12px;align-items:flex-start;padding:14px 4px;border-bottom:1px solid var(--ln);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{width:28px;height:28px;flex:none;accent-color:var(--ok)}
.chk.done b{text-decoration:line-through;color:var(--mu)}
.roles{display:flex;flex-wrap:wrap;gap:8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const KEY='livez:sched:v1',DB='livez:db:v2',WHO='livez:sched:who';
const ROLES=['Housekeeper','Gardener','Caretaker','Electrician','Plumber'];
const rd=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>new Date(s+'T00:00:00');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=iso(new Date());
let S=rd(KEY,{tasks:[],runs:{}});
const db=rd(DB,{}),props=db.properties||[],staff=db.staff||[];
const q=new URLSearchParams(location.search);
const role=ROLES.find(r=>r.toLowerCase()===(q.get('role')||'').toLowerCase())||'';
let date=/^\d{4}-\d{2}-\d{2}$/.test(q.get('date')||'')?q.get('date'):today, prop='';
let who='';try{who=localStorage.getItem(WHO)||''}catch(e){}
const pName=id=>(props.find(p=>p.id===id)||{}).name||'';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Could not save on this phone.')}};
function isDue(t,ds){
  if(!t.active||ds<t.start)return false;
  const d=parse(ds);
  if(t.freq==='daily')return true;
  if(t.freq==='weekly')return d.getDay()===+t.dow;
  return d.getDate()===Math.min(+t.dom,new Date(d.getFullYear(),d.getMonth()+1,0).getDate());
}
const shift=n=>{const d=parse(date);d.setDate(d.getDate()+n);date=iso(d);render()};

function render(){
  const app=document.getElementById('app');
  if(!role){
    app.innerHTML=`<h1>Liv<b>EZ</b> · My tasks</h1><p class="mu">Choose your role</p><div class="roles">${ROLES.map(r=>`<a class="btn pri" href="?role=${r.toLowerCase()}">${r}</a>`).join('')}</div>`;return;
  }
  S=rd(KEY,S);
  const list=S.tasks.filter(t=>t.role===role&&isDue(t,date)&&(!prop||!t.property||t.property===prop)).sort((a,b)=>a.time.localeCompare(b.time));
  const st=t=>S.runs[t.id+'|'+date];
  const done=list.filter(t=>st(t)&&st(t).status==='Done').length;
  const future=date>today;
  const dl=parse(date).toLocaleDateString('en',{weekday:'long',day:'numeric',month:'short'});
  app.innerHTML=`<h1>Liv<b>EZ</b> · ${esc(role)} tasks</h1>
  <div class="card"><div class="row"><button class="btn sm" id="prev">←</button><div style="text-align:center"><b>${dl}</b>${date===today?'<div class="mu">Today</div>':'<div><button class="btn sm" id="now">Go to today</button></div>'}</div><button class="btn sm" id="next">→</button></div>
   <div class="bar"><i style="width:${list.length?Math.round(done/list.length*100):0}%"></i></div><div class="mu" style="margin-top:4px">${done} of ${list.length} done</div></div>
  <div class="card"><label class="mu">Your name</label><input type="text" id="who" list="names" value="${esc(who)}" placeholder="Enter your name">
   <datalist id="names">${staff.filter(s=>s.role===role).map(s=>`<option value="${esc(s.name)}">`).join('')}</datalist>
   ${props.length>1?`<label class="mu" style="display:block;margin-top:8px">Property</label><select id="prop"><option value="">All properties</option>${props.map(p=>`<option value="${esc(p.id)}"${p.id===prop?' selected':''}>${esc(p.name)}</option>`).join('')}</select>`:''}</div>
  <div class="card">${list.length?list.map(t=>{const r=st(t),d=r&&r.status==='Done';
   return `<label class="chk ${d?'done':''}"><input type="checkbox" data-id="${t.id}" ${d?'checked':''} ${future?'disabled':''}><span><b>${esc(t.title)}</b><div class="mu">${esc(t.time)}${pName(t.property)?' · '+esc(pName(t.property)):''}</div>
   ${t.notes?`<div class="mu">${esc(t.notes)}</div>`:''}${d?`<div class="mu">✔ ${esc(r.by||'')} · ${new Date(r.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>`:''}
   ${r&&r.status==='Skipped'?`<div class="mu">Skipped: ${esc(r.note||'')}</div>`:''}
   ${!d&&!future?`<button class="btn sm" data-skip="${t.id}" style="margin-top:6px">${r?'Undo skip':'Can’t do'}</button>`:''}</span></label>`}).join(''):
   `<p class="mu">${S.tasks.length?'No tasks for you on this day. Enjoy!':'No tasks have been set up yet. Ask your manager to load the task list.'}</p>`}</div>`;
  document.getElementById('prev').onclick=()=>shift(-1);document.getElementById('next').onclick=()=>shift(1);
  const now=document.getElementById('now');if(now)now.onclick=()=>{date=today;render()};
  document.getElementById('who').onchange=e=>{who=e.target.value.trim();try{localStorage.setItem(WHO,who)}catch(x){}};
  const ps=document.getElementById('prop');if(ps)ps.onchange=e=>{prop=e.target.value;render()};
}
document.addEventListener('change',e=>{
  const id=e.target.dataset&&e.target.dataset.id;if(!id)return;
  const k=id+'|'+date;
  if(e.target.checked){
    if(!who){const n=prompt('Please enter your name');if(!n){e.target.checked=false;return}who=n.trim();try{localStorage.setItem(WHO,who)}catch(x){}}
    S.runs[k]={status:'Done',note:'',by:who,at:new Date().toISOString()};
  }else delete S.runs[k];
  save();render();
});
document.addEventListener('click',e=>{
  const id=e.target.dataset&&e.target.dataset.skip;if(!id)return;
  e.preventDefault();const k=id+'|'+date;
  if(S.runs[k])delete S.runs[k];
  else{const n=prompt('Why can’t it be done?');if(n===null)return;S.runs[k]={status:'Skipped',note:n,by:who,at:new Date().toISOString()}}
  save();render();
});
window.addEventListener('storage',e=>{if(e.key===KEY)render()});
const SAMPLES=[ // title, role, category, freq, weekday, day-of-month, time
['Washroom cleaning','Housekeeper','Housekeeping','daily',1,1,'08:00'],
['Corridor cleaning','Housekeeper','Housekeeping','daily',1,1,'09:00'],
['Staircase & common area mopping','Housekeeper','Housekeeping','daily',1,1,'10:00'],
['Dustbin collection & disposal','Housekeeper','Housekeeping','daily',1,1,'07:30'],
['Change bedsheets','Housekeeper','Housekeeping','weekly',1,1,'11:00'],
['Change curtains','Housekeeper','Housekeeping','monthly',1,1,'11:00'],
['Room cleaning & dusting','Housekeeper','Housekeeping','daily',1,1,'11:30'],
['Kitchen & dining area cleaning','Housekeeper','Housekeeping','daily',1,1,'12:30'],
['Clean windows & balcony','Housekeeper','Housekeeping','weekly',3,1,'14:00'],
['Remove dry leaves & weeds','Gardener','Garden','weekly',3,1,'08:30'],
['Watering plants','Gardener','Garden','daily',1,1,'07:00'],
['Trim plants & clean garden area','Gardener','Garden','weekly',6,1,'08:00'],
['Fertilise plants','Gardener','Garden','monthly',1,10,'08:00'],
['Water tank cleaning','Caretaker','Water tank','weekly',6,1,'10:00'],
['Fire extinguisher & exit check','Caretaker','Fire safety','monthly',1,1,'11:00'],
['Pest control spray','Caretaker','Pest control','monthly',1,15,'11:00']];
if(!S.seeded&&!S.tasks.length){ // first open: preload the basic task list
  SAMPLES.forEach((x,i)=>S.tasks.push({id:'m'+Date.now().toString(36)+i,title:x[0],role:x[1],category:x[2],freq:x[3],dow:x[4],dom:x[5],time:x[6],start:today,property:'',assignee:'',notes:'',active:true}));
  S.seeded=true;save();
}
render();
</script>
</body>
</html>
